[tool.poetry]
name = "yntd-kobosil"
version = "0.1.0"
description = "Stock lakehouse: brapi.dev ingestion, OLTP + CDC, Iceberg lakehouse, dbt Gold, dashboard and insights agent"
authors = ["LMP"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31"
psycopg2-binary = "^2.9"
python-dotenv = "^1.0"
fastapi = "^0.141.1"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^24.0"
ruff = "^0.5"
pytest-asyncio = "^0.24"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]